<!DOCTYPE html>
<html lang="en" data-theme="pct">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCT Catalyst — Leadership Transformation Assessment</title>
  <meta name="description" content="PCT Catalyst: A leadership transformation assessment tool built on the People-Centered Transformation methodology by Tony O'Driscoll, Duke University." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN (enables DaisyUI utility classes) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- DaisyUI v5 — semantic component classes + theming -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/dist/daisyui.min.css" rel="stylesheet" />

  <!-- Chart.js for radar chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- React 18 via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind config + PCT custom theme -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans:    ['Inter', 'system-ui', 'sans-serif'],
            display: ['Fraunces', 'Georgia', 'serif'],
            mono:    ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Custom PCT theme for DaisyUI -->
  <style>
    @layer base {
      [data-theme="pct"] {
        --color-primary:         oklch(41.8% 0.093 172.9);
        --color-primary-content: oklch(98% 0.01 172.9);
        --color-secondary:       oklch(34% 0.082 172.9);
        --color-accent:          oklch(68% 0.12 172.9);
        --color-neutral:         oklch(32% 0.025 248);
        --color-base-100:        oklch(97% 0.005 248);
        --color-base-200:        oklch(94% 0.007 248);
        --color-base-300:        oklch(90% 0.009 248);
        --color-base-content:    oklch(20% 0.02 248);
        --color-info:            oklch(55% 0.18 240);
        --color-success:         oklch(50% 0.14 142);
        --color-warning:         oklch(68% 0.15 58);
        --color-error:           oklch(55% 0.22 25);

        --radius-selector:       0.5rem;
        --radius-field:          0.375rem;
        --radius-box:            0.75rem;
        --border:                1px;
      }
    }

    /* ── App globals ── */
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Custom font helpers ── */
    .font-display { font-family: 'Fraunces', Georgia, serif; }
    .font-mono-app { font-family: 'JetBrains Mono', monospace; }

    /* ── Quadrant badge colours ── */
    .badge-aspiration     { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
    .badge-alignment      { background: #ede9fe; color: #6d28d9; border-color: #ddd6fe; }
    .badge-autonomy       { background: #ffedd5; color: #c2410c; border-color: #fed7aa; }
    .badge-accountability { background: #d1fae5; color: #065f46; border-color: #a7f3d0; }

    /* ── Likert scale ── */
    .likert-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .likert-btn {
      height: 48px;
      width: 100%;
      border: 1.5px solid oklch(85% 0.009 248);
      border-radius: 6px;
      background: oklch(97% 0.005 248);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      color: oklch(60% 0.02 248);
      transition: all 140ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .likert-btn:hover {
      border-color: oklch(41.8% 0.093 172.9);
      color: oklch(41.8% 0.093 172.9);
      background: oklch(97% 0.03 172.9);
      transform: translateY(-2px);
      box-shadow: 0 3px 10px oklch(41.8% 0.093 172.9 / 0.15);
    }
    .likert-btn.selected {
      background: oklch(41.8% 0.093 172.9);
      border-color: oklch(41.8% 0.093 172.9);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 3px 12px oklch(41.8% 0.093 172.9 / 0.3);
    }

    /* ── Priority card ── */
    .priority-card {
      border: 1.5px solid oklch(90% 0.009 248);
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: all 140ms ease;
      background: oklch(97% 0.005 248);
    }
    .priority-card:hover {
      border-color: oklch(41.8% 0.093 172.9);
      background: oklch(97% 0.03 172.9);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px oklch(41.8% 0.093 172.9 / 0.12);
    }
    .priority-card.selected {
      border-color: oklch(41.8% 0.093 172.9);
      background: oklch(95% 0.04 172.9);
      box-shadow: 0 0 0 3px oklch(85% 0.06 172.9);
    }

    /* ── Rank drag item ── */
    .rank-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: oklch(97% 0.005 248);
      border: 1.5px solid oklch(90% 0.009 248);
      border-radius: 8px;
      cursor: grab;
      transition: all 140ms ease;
      user-select: none;
    }
    .rank-item:hover {
      border-color: oklch(41.8% 0.093 172.9);
      background: oklch(97% 0.03 172.9);
    }
    .rank-item.drag-over {
      border-color: oklch(41.8% 0.093 172.9);
      border-style: dashed;
    }

    /* ── AI card gradient header ── */
    .ai-header {
      background: linear-gradient(135deg, oklch(34% 0.082 172.9), oklch(41.8% 0.093 172.9));
      color: white;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid oklch(90% 0.009 248);
      border-top-color: oklch(41.8% 0.093 172.9);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .spinner-lg { width: 36px; height: 36px; border-width: 3px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Score bar ── */
    .score-bar {
      height: 6px;
      border-radius: 3px;
      background: oklch(90% 0.009 248);
      flex: 1;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: oklch(41.8% 0.093 172.9);
      transition: width 0.4s ease;
    }

    /* ── PCT Framework grid ── */
    .quadrant-card {
      border-radius: 10px;
      padding: 14px 16px;
    }

    /* ── Radar canvas ── */
    .radar-canvas-wrap canvas {
      width: 100% !important;
      height: 460px !important;
    }

    /* ── Slideover ── */
    .slideover {
      position: fixed;
      right: 0; top: 0; bottom: 0;
      width: min(640px, 100vw);
      background: oklch(97% 0.005 248);
      box-shadow: -8px 0 40px oklch(20% 0.02 248 / 0.15);
      z-index: 200;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* ── Admin sidebar ── */
    .admin-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 58px);
    }
    @media (max-width: 768px) {
      .admin-layout { grid-template-columns: 1fr; }
    }

    /* ── Coaching quote ── */
    .coaching-quote {
      padding: 12px 16px;
      background: oklch(95% 0.04 172.9);
      border-left: 3px solid oklch(41.8% 0.093 172.9);
      border-radius: 0 6px 6px 0;
      font-style: italic;
      color: oklch(30% 0.02 248);
      font-size: 0.9375rem;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    /* ── Timeline ── */
    .timeline-period {
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: oklch(95% 0.04 172.9);
      color: oklch(41.8% 0.093 172.9);
      padding: 2px 7px;
      border-radius: 12px;
      border: 1px solid oklch(85% 0.06 172.9);
      white-space: nowrap;
    }

    /* ── Print ── */
    @media print {
      nav, .steps, .btn, .no-print { display: none !important; }
      body { background: #fff; }
      .card { box-shadow: none; border: 1px solid #ddd; }
    }

    /* ── App loading ── */
    .app-loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="app-loading">
      <div class="spinner spinner-lg"></div>
      <span class="text-base-content/50 text-sm">Loading PCT Catalyst…</span>
    </div>
  </div>

  <!-- Data: PCT elements (must load before JSX components) -->
  <script src="/data.js"></script>

  <!-- JSX Components — loaded in dependency order -->
  <script type="text/babel" src="/pct-visuals.jsx"></script>
  <script type="text/babel" src="/radar.jsx"></script>
  <script type="text/babel" src="/screens.jsx"></script>
  <script type="text/babel" src="/admin.jsx"></script>
  <script type="text/babel" src="/app.jsx"></script>
</body>
</html>
